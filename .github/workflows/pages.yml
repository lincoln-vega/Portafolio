name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Normalize OIDC audience
        run: |
          if [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *"&audience="* ]]; then
            base_url="${ACTIONS_ID_TOKEN_REQUEST_URL%%&audience=*}"
          else
            base_url="$ACTIONS_ID_TOKEN_REQUEST_URL"
          fi
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=${base_url}&audience=https://github.com/${GITHUB_REPOSITORY_OWNER}" >> "$GITHUB_ENV"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
